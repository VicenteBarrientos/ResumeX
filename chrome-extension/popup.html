<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResumeX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      font-size: 13px;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 30px; height: 30px;
      background: #0d1117;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #22d3ee;
    }
    .logo-text { font-size: 14px; font-weight: 700; }
    .logo-text span { color: #22d3ee; }
    .body { padding: 16px; }
    .section { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }
    input {
      width: 100%; padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #f0f6fc;
      font-size: 13px; outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #22d3ee; }
    button {
      width: 100%; padding: 9px;
      border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .btn-primary { background: linear-gradient(135deg, #22d3ee, #3b82f6); color: #0d1117; }
    .btn-secondary { background: rgba(255,255,255,0.07); color: #f0f6fc; margin-top: 8px; }
    .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; margin-top: 8px; }
    .error { color: #f87171; font-size: 11px; margin-top: 6px; }
    .status-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 12px;
    }
    .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .status-row:last-child { margin-bottom: 0; }
    .status-label { color: #8b949e; }
    .status-value { font-weight: 600; color: #f0f6fc; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22d3ee; display: inline-block; margin-right: 6px; }
    .score-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 4px; overflow: hidden; }
    .score-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
    .score-high { background: #22c55e; }
    .score-mid { background: #f59e0b; }
    .score-low { background: #ef4444; }
    .job-info { font-size: 12px; color: #8b949e; margin-bottom: 12px; line-height: 1.5; }
    .job-info strong { color: #f0f6fc; }
    .saved-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(34,197,94,0.15); color: #4ade80;
      border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 600;
    }
    #view { display: none; }
    #login { display: none; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #22d3ee; border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">RX</div>
    <span class="logo-text">Resume<span>X</span></span>
  </div>

  <div class="body">
    <!-- Login view -->
    <div id="login">
      <div class="section">
        <label>Username</label>
        <input type="text" id="username" placeholder="Your ResumeX username" autocomplete="username" />
      </div>
      <div class="section">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div id="login-error" class="error"></div>
      <button class="btn-primary" id="login-btn">Connect to ResumeX</button>
    </div>

    <!-- Connected view -->
    <div id="view">
      <div class="status-box" style="margin-bottom:12px;">
        <div class="status-row">
          <span class="status-label"><span class="dot"></span>Connected</span>
          <span class="status-value" id="username-display"></span>
        </div>
      </div>

      <div id="job-section" style="display:none;">
        <div class="job-info" id="job-info"></div>

        <div id="score-section" style="display:none; margin-bottom:12px;">
          <label>Match Score</label>
          <div class="status-box">
            <div class="status-row">
              <span class="status-label">Your fit</span>
              <span class="status-value" id="score-value"></span>
            </div>
            <div class="score-bar"><div class="score-fill" id="score-bar"></div></div>
            <div id="score-gap" style="margin-top:8px; font-size:11px; color:#8b949e;"></div>
          </div>
        </div>

        <div id="save-section">
          <div id="saved-badge" style="display:none; margin-bottom:8px;">
            <span class="saved-badge">✓ Saved to tracker</span>
          </div>
          <button class="btn-primary" id="save-btn">Save to Tracker</button>
        </div>
      </div>

      <div id="no-job" style="color:#8b949e; font-size:12px; text-align:center; padding: 16px 0;">
        Open a job posting to see your match score and save it.
      </div>

      <button class="btn-secondary" id="open-tracker">Open Tracker →</button>
      <button class="btn-danger" id="logout-btn">Disconnect</button>
    </div>

    <div id="loading" style="text-align:center; padding:24px;">
      <span class="spinner"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
